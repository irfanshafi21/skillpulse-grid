<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Dark Purple Base Ribbon Gradient -->
    <linearGradient id="purpleRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="60%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Bright Lavender/Violet Ribbon Gradient -->
    <linearGradient id="violetRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Arrow Head Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>

    <!-- Glowing Core Effect -->
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Light Dashboard Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="32"/>

  <g transform="translate(10, 10)">
    <!-- Subtle Background Grid Guide Lines -->
    <g opacity="0.15" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="4,4">
      <line x1="40" y1="80" x2="340" y2="80" />
      <line x1="40" y1="190" x2="340" y2="190" />
      <line x1="40" y1="300" x2="340" y2="300" />
      <line x1="100" y1="40" x2="100" y2="340" />
      <line x1="190" y1="40" x2="190" y2="340" />
      <line x1="280" y1="40" x2="280" y2="340" />
    </g>

    <!-- Back Loop Layer (Deep Purple Ribbon) -->
    <path d="M 190,190 
             C 245,95 330,95 330,190 
             C 330,285 245,285 190,190 
             C 135,95 50,95 50,190 
             C 50,285 135,285 190,190 Z" 
          fill="none" 
          stroke="url(#purpleRibbon)" 
          stroke-width="46" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Front Overlapping Layer (Bright Lavender/Violet Ribbon) -->
    <path d="M 90,265 
             C 130,280 165,240 190,190 
             C 220,130 265,95 305,120" 
          fill="none" 
          stroke="url(#violetRibbon)" 
          stroke-width="42" 
          stroke-linecap="round"/>

    <!-- Central Glowing Sphere Node -->
    <circle cx="190" cy="190" r="32" fill="#A78BFA" opacity="0.4" filter="url(#purpleGlow)"/>
    <circle cx="190" cy="190" r="20" fill="#C4B5FD" filter="url(#purpleGlow)"/>
    <circle cx="190" cy="190" r="10" fill="#FFFFFF"/>

    <!-- Upward Breakout Arrow on Right Loop -->
    <g transform="translate(250, 115) rotate(-35)">
      <path d="M 0,10 L 0,-65" stroke="url(#arrowGrad)" stroke-width="22" stroke-linecap="round"/>
      <path d="M -22,-45 L 0,-78 L 22,-45" fill="none" stroke="url(#arrowGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
